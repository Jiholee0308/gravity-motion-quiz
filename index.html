<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중력과 운동 종합 인터랙티브 50제</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #cbd5e1;
            --success: #16a34a;
            --error: #dc2626;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #0f172a;
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        .progress-bar-container {
            background-color: #e2e8f0;
            border-radius: 9999px;
            height: 10px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 15px;
            font-weight: bold;
        }
        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            background-color: #ffffff;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #eff6ff;
        }
        .option-btn:disabled {
            cursor: default;
        }
        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #166534 !important;
            font-weight: bold;
        }
        .option-btn.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #991b1b !important;
        }
        .feedback-box {
            background-color: #f1f5f9;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 25px;
            display: none;
            font-size: 15px;
            line-height: 1.5;
            border-left: 5px solid var(--primary);
        }
        .feedback-box.correct-fb {
            border-left-color: var(--success);
            background-color: #f0fdf4;
            color: #166534;
        }
        .feedback-box.incorrect-fb {
            border-left-color: var(--error);
            background-color: #fef2f2;
            color: #991b1b;
        }
        .navigation-footer {
            display: flex;
            justify-content: flex-end;
        }
        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
        .next-btn:hover {
            background-color: var(--primary-hover);
        }
        .result-screen {
            text-align: center;
            display: none;
        }
        .result-score {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
        .restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>중력과 운동 종합 50제</h1>
    
    <div id="quiz-container">
        <div class="status-header">
            <span id="question-progress">문항 1 / 50</span>
            <span id="score-tracker">맞힌 개수: 0</span>
        </div>
        
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="question-box" class="question-box">문제를 불러오는 중입니다...</div>
        <div id="options-container" class="options-container"></div>
        <div id="feedback-box" class="feedback-box"></div>

        <div class="navigation-footer">
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">다음 문제로 이동</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h2>퀴즈가 완료되었습니다!</h2>
        <p>수고하셨습니다. 최종 점수:</p>
        <div id="final-score" class="result-score">0 / 50</div>
        <button class="restart-btn" onclick="restartQuiz()">처음부터 다시 풀기</button>
    </div>
</div>

<script>
    const questions = [
        { q: "어떤 물체가 4초 동안 속력이 2 m/s에서 10 m/s로 일정하게 증가하였다. 이 물체의 가속도의 크기는?", options: ["1 m/s²", "2 m/s²", "4 m/s²", "8 m/s²"], answer: 1, rationale: "가속도 = 속도 변화량 / 걸린 시간 = (10 - 2) / 4 = 2 m/s² 입니다." },
        { q: "정지해 있던 공을 가만히 놓아 자유 낙하 시켰다. 낙하 후 4초가 지났을 때 순간 속력은? (g = 10 m/s²)", options: ["10 m/s", "20 m/s", "30 m/s", "40 m/s"], answer: 3, rationale: "자유 낙하 속도 v = gt = 10 × 4 = 40 m/s 입니다." },
        { q: "자유 낙하하는 물체가 낙하한 시간(t)과 낙하 거리(h) 사이의 관계식으로 옳은 것은?", options: ["h = gt", "h = 2gt", "h = (1/2)gt²", "h = gt²"], answer: 2, rationale: "자유 낙하 이동 거리는 h = (1/2)gt² (약 5t²)입니다." },
        { q: "자유 낙하 운동에서 1초 동안 이동한 거리가 5m일 때, 3초 동안 자유 낙하한 물체의 총 낙하 거리는?", options: ["15 m", "30 m", "45 m", "60 m"], answer: 2, rationale: "h = 5 × 3² = 45m 입니다." },
        { q: "지구상에서 자유 낙하하는 물체의 1초당 속력 증가량(중력가속도)의 크기로 가장 적절한 것은?", options: ["약 4.9 m/s", "약 9.8 m/s", "약 19.6 m/s", "약 98 m/s"], answer: 1, rationale: "지표면 근처 중력가속도 g는 약 9.8 m/s²입니다." },
        { q: "가속도의 단위로 올바른 것은?", options: ["m/s", "m/s²", "m²", "kg·m/s"], answer: 1, rationale: "가속도는 단위 시간당 속도 변화량이므로 m/s²입니다." },
        { q: "정지 상태에서 출발하여 5초 동안 자유 낙하한 물체의 최종 속력은? (g = 10 m/s²)", options: ["25 m/s", "40 m/s", "50 m/s", "125 m/s"], answer: 2, rationale: "v = gt = 10 × 5 = 50 m/s입니다." },
        { q: "자유 낙하 운동에서 0~1초 사이의 낙하 거리와 1~2초 사이의 낙하 거리의 비는?", options: ["1 : 1", "1 : 2", "1 : 3", "1 : 4"], answer: 2, rationale: "각 구간별 이동 거리는 5m, 15m로 1 : 3 비율을 가집니다." },
        { q: "질량이 1kg인 물체와 5kg인 물체를 같은 높이에서 동시에 자유 낙하 시켰을 때 (공기 저항 무시), 지면에 도달하는 시간은?", options: ["1kg이 먼저 도달", "5kg이 먼저 도달", "동시에 도달", "질량에 따라 다름"], answer: 2, rationale: "공기 저항이 없으면 질량과 무관하게 동시에 도달합니다." },
        { q: "자유 낙하 운동에서 속력(v)-시간(t) 그래프의 기울기가 의미하는 것은?", options: ["이동 거리", "가속도", "평균 속력", "질량"], answer: 1, rationale: "v-t 그래프의 기울기는 가속도입니다." },
        { q: "높은 곳에서 수평 방향으로 공을 던졌을 때, 공의 운동은 어떤 두 운동의 합성인가?", options: ["등속+등속", "등속+가속", "가속+가속", "자유낙하+수직등속"], answer: 1, rationale: "수평 등속 운동과 연직 가속 운동의 합성입니다." },
        { q: "수평 방향으로 던진 공이 운동하는 동안 수평 방향의 속력 변화는?", options: ["일정하게 증가", "일정하게 감소", "일정하게 유지(등속)", "증가하다 감소"], answer: 2, rationale: "공기 저항을 무시하면 수평 방향 외력이 없어 속력이 일정합니다." },
        { q: "높이가 같은 곳에서 A공은 가만히 놓고, B공은 수평으로 던졌다. 지면에 도달하는 시간은?", options: ["A가 먼저", "B가 먼저", "동시에 도달", "던진 속력에 따라 다름"], answer: 2, rationale: "연직 방향 운동은 독립적이므로 동시에 도달합니다." },
        { q: "수평으로 20 m/s와 40 m/s로 각각 던진 공의 연직 방향 가속도 크기 비교는?", options: ["20 m/s 쪽이 큼", "40 m/s 쪽이 큼", "서로 같다", "질량에 따라 다름"], answer: 2, rationale: "둘 다 중력가속도로 동일합니다." },
        { q: "수평으로 던진 물체의 연직 방향 운동은 어떤 운동과 동일한가?", options: ["등속 직선 운동", "자유 낙하 운동", "등가속도 원운동", "진자의 운동"], answer: 1, rationale: "연직 방향은 중력에 의한 자유 낙하 운동입니다." },
        { q: "수평 방향으로 던진 공의 운동 경로(궤적) 모양은?", options: ["직선", "포물선", "원", "나선형"], answer: 1, rationale: "아래로 볼록한 포물선 모양을 그립니다." },
        { q: "같은 높이에서 A는 5 m/s, B는 15 m/s로 던졌을 때, 수평 이동 거리가 더 긴 것은?", options: ["A공", "B공", "같다", "높이에 따라 다름"], answer: 1, rationale: "시간이 같을 때 수평 속력이 빠른 B가 더 멀리 갑니다." },
        { q: "수평으로 던진 공의 연직 방향 속력은 시간에 따라 어떻게 변하는가?", options: ["일정하다", "시간에 비례해 일정하게 증가", "시간 제곱에 비례", "증가하다 감소"], answer: 1, rationale: "연직 방향은 등가속도 운동이므로 시간에 비례해 속력이 증가합니다." },
        { q: "수평으로 던진 공에 공기 저항이 작용할 때, 수평 방향 운동은?", options: ["속력 일정", "속력 점차 감소", "속력 점차 증가", "자유낙하로 변경"], answer: 1, rationale: "공기 저항이 있으면 수평 속력이 점차 감소합니다." },
        { q: "수평 방향과 연직 방향 운동의 상호 관계에 대한 설명으로 옳은 것은?", options: ["수평 속력이 낙하 시간에 영향", "두 운동은 독립적으로 일어남", "연직 속력이 수평에 영향", "동일한 성질의 운동"], answer: 1, rationale: "두 운동은 서로 영향을 주지 않고 독립적으로 진행됩니다." },
        { q: "뉴턴의 사고실험에서 포탄이 지구 주위를 계속 돌기 위한 조건은?", options: ["중력이 사라지는 높이", "수평 발사 속도를 충분히 크게", "질량을 작게", "연직 위로 발사"], answer: 1, rationale: "충분한 수평 속력(약 8 km/s)이 필요합니다." },
        { q: "인공위성 원운동 시 포탄에 작용하는 알짜힘(중력)의 방향은?", options: ["운동 방향(접선)", "지구 중심 방향", "운동 반대 방향", "지구 바깥 방향"], answer: 1, rationale: "중력은 항상 원의 중심인 지구 중심을 향합니다." },
        { q: "지구 주위를 원운동하는 인공위성의 속력과 운동 방향은?", options: ["모두 일정", "속력 일정, 방향 계속 변함", "속력 변함, 방향 일정", "모두 변함"], answer: 1, rationale: "등속 원운동이므로 속력은 일정하나 방향은 계속 바뀝니다." },
        { q: "지구 표면 근처에서 인공위성이 지표면에 안 부딪히고 돌기 위한 수평 발사 속력은?", options: ["1 km/s", "8 km/s", "11.2 km/s", "30 km/s"], answer: 1, rationale: "약 8 km/s입니다." },
        { q: "뉴턴의 사고실험에서 대포알을 너무 느리게 쏘면 어떻게 되는가?", options: ["지구 주위를 돔", "우주로 날아감", "지표면에 떨어진다(포물선)", "정지함"], answer: 2, rationale: "속도가 부족하면 지표면에 충돌합니다." },
        { q: "인공위성이 돌 때 중력의 역할은?", options: ["속력을 빠르게 함", "운동 방향을 바꾸어 원운동을 하게 함(구심력)", "마찰력 발생", "정지시킴"], answer: 1, rationale: "중력이 구심력 역할을 하여 원운동을 유지시킵니다." },
        { q: "지구를 도는 인공위성 중심 방향으로 가속도가 발생하는 이유는?", options: ["속력이 증가해서", "중력에 의해 운동 방향이 계속 변하므로", "공기 마찰 때문에", "지구 자전 때문에"], answer: 1, rationale: "방향의 변화도 가속도를 유발합니다." },
        { q: "사고실험에서 발사 속도를 점점 증가시킬 때 포탄의 낙하 지점은?", options: ["가까워짐", "멀어지다가 결국 지구를 돔", "제자리로 옴", "변화 없음"], answer: 1, rationale: "속도가 빨라질수록 멀리 떨어지다 궤도를 형성합니다." },
        { q: "인공위성 내부 물체가 무중력처럼 보이는 이유는?", options: ["중력이 0이라서", "인공위성과 함께 자유 낙하 중이어서", "공기가 없어서", "원심력 때문"], answer: 1, rationale: "함께 자유 낙하 운동을 하고 있기 때문입니다." },
        { q: "매우 높은 상공 궤도를 도는 인공위성의 중력 크기는 지표면보다?", options: ["더 크다", "더 작다", "완전히 0이다", "같다"], answer: 1, rationale: "중심에서 멀어질수록 중력은 감소합니다." },
        { q: "실에 묶인 공이 등속 원운동을 할 때 구심력의 방향은?", options: ["원의 중심 방향", "원의 접선 방향", "원의 바깥 방향", "운동 반대 방향"], answer: 0, rationale: "구심력은 항상 중심 방향입니다." },
        { q: "실에 묶여 원운동하던 공의 실이 끊어지는 순간 날아가는 방향은?", options: ["중심 방향", "끊어진 순간의 접선 방향", "바깥 방향", "운동 반대 방향"], answer: 1, rationale: "관성에 의해 접선 방향으로 날아갑니다." },
        { q: "직선 운동 물체에 운동 방향과 수직인 방향으로 힘을 계속 가하면?", options: ["등속 직선", "자유 낙하", "원운동", "진자 운동"], answer: 2, rationale: "수직 방향의 힘은 원운동을 유발합니다." },
        { q: "다각형 경로 사고실험에서 힘을 가하는 순간은 언제인가?", options: ["방향이 꺾이는 꼭짓점", "변을 따라 도는 도중", "원운동 끝난 후", "힘 필요 없음"], answer: 0, rationale: "각 꼭짓점마다 방향을 바꾸기 위해 힘이 작용합니다." },
        { q: "다각형 경로에서 변의 개수가 무한히 많아질 때 물체의 운동은?", options: ["직선", "포물선", "매끄러운 원운동", "불규칙 운동"], answer: 2, rationale: "부드러운 곡선인 원운동이 됩니다." },
        { q: "등속 원운동하는 물체에 대한 설명으로 옳은 것은? (ㄱ.속력 일정 ㄴ.가속도 방향 중심 ㄷ.알짜힘 0)", options: ["ㄱ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], answer: 1, rationale: "알짜힘(구심력)이 0이 아니므로 ㄷ은 틀렸습니다." },
        { q: "원운동에서 물체의 속력이 일정하더라도 가속도 운동인 이유는?", options: ["등속도 운동이므로", "방향이 변하므로 속도가 변하기 때문", "정지 상태여서", "자유낙하라서"], answer: 1, rationale: "방향의 변화도 속도의 변화(가속도)에 포함됩니다." },
        { q: "회전 놀이기구에서 바깥으로 쏠리는 느낌을 받을 때, 실제 당기는 힘의 방향은?", options: ["바깥쪽", "안쪽(중심) 방향", "위쪽", "아래쪽"], answer: 1, rationale: "실제 구심력은 중심 방향입니다." },
        { q: "원운동에서 구심력이 클수록 미치는 영향은?", options: ["반지름이 커짐", "운동 방향이 더 급격하게 꺾임(반지름 작아짐)", "속력이 0이 됨", "영향 없음"], answer: 1, rationale: "구심력이 클수록 회전 반경이 작아집니다." },
        { q: "다음 중 원운동의 예시로 가장 거리가 먼 것은?", options: ["세탁기 탈수", "지구를 도는 달", "고속도로 커브길", "자유 낙하하는 사과"], answer: 3, rationale: "사과 낙하는 직선 운동입니다." },
        { q: "뉴턴 이전의 전통적 세계관에서 천상계와 지상계 운동에 대한 설명은?", options: ["법칙이 동일함", "천상계는 원운동, 지상계는 직선/포물선으로 서로 다름", "천상계는 중력이 지배", "지상계도 원운동"], answer: 1, rationale: "과거에는 두 세계의 법칙이 다르다고 믿었습니다." },
        { q: "뉴턴이 역학 체계를 확립하며 이룬 가장 위대한 통합적 업적은?", options: ["법칙 분리", "지구상 포물선과 우주 원운동을 '중력'으로 통합", "중력 부정", "전자기력 통합"], answer: 1, rationale: "중력 법칙을 통해 천상계와 지상계를 통합했습니다." },
        { q: "만유인력 법칙과 운동 법칙이 적용되는 범위는?", options: ["지구 위만", "우주 공간만", "지상계와 천상계 모두(보편적)", "실험실만"], answer: 2, rationale: "우주 전반에 보편적으로 적용됩니다." },
        { q: "지구상 낙하 운동과 달의 공전 운동을 동일한 중력으로 설명한 과학자는?", options: ["갈릴레오", "뉴턴", "아인슈타인", "케플러"], answer: 1, rationale: "아이작 뉴턴입니다." },
        { q: "뉴턴이 고전 역학의 기초를 집대성하여 출판한 저서의 이름은?", options: ["종의 기원", "프린키피아", "상대성 이론", "코스모스"], answer: 1, rationale: "《프린키피아》입니다." },
        { q: "뉴턴의 운동 3법칙과 직접 관련이 없는 것은?", options: ["관성의 법칙", "가속도의 법칙", "작용·반작용의 법칙", "파동의 법칙"], answer: 3, rationale: "파동의 법칙은 뉴턴의 운동 3법칙에 포함되지 않습니다." },
        { q: "행성의 태양 공전과 사과의 낙하 원인을 제공하는 동일한 힘은?", options: ["전자기력", "자기력", "중력(만유인력)", "핵력"], answer: 2, rationale: "중력입니다." },
        { q: "뉴턴의 업적이 과학사에 미친 가장 큰 영향은?", options: ["마법을 과학으로 인정", "자연 현상을 수학적/보편적 법칙으로 설명", "물리학 연구 종결", "실험 배제"], answer: 1, rationale: "수학적이고 보편적인 법칙으로 자연을 설명했습니다." },
        { q: "지구를 도는 달이 떨어지지 않고 궤도를 유지하는 이유는?", options: ["빠른 속력으로 공전하며 자유 낙하를 계속해서", "중력이 없어서", "태양이 밀어내서", " 자체 엔진이 있어서"], answer: 0, rationale: "수평 방향의 빠른 속력과 자유 낙하 운동이 결합되어 있기 때문입니다." },
        { q: "뉴턴 역학에 대한 설명으로 옳은 것을 모두 고르면? (ㄱ.법칙 동일 ㄴ.고전물리학 기틀 ㄷ.수학적 분석)", options: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], answer: 3, rationale: "모든 보기가 올바릅니다." }
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;

    const questionProgress = document.getElementById('question-progress');
    const scoreTracker = document.getElementById('score-tracker');
    const progressBar = document.getElementById('progress-bar');
    const questionBox = document.getElementById('question-box');
    const optionsContainer = document.getElementById('options-container');
    const feedbackBox = document.getElementById('feedback-box');
    const nextBtn = document.getElementById('next-btn');
    const quizContainer = document.getElementById('quiz-container');
    const resultScreen = document.getElementById('result-screen');
    const finalScore = document.getElementById('final-score');

    function loadQuestion() {
        answered = false;
        feedbackBox.style.display = 'none';
        feedbackBox.className = 'feedback-box';
        nextBtn.style.display = 'none';

        const current = questions[currentIdx];
        questionProgress.textContent = `문항 ${currentIdx + 1} / ${questions.length}`;
        scoreTracker.textContent = `맞힌 개수: ${score}`;
        progressBar.style.width = `${(currentIdx / questions.length) * 100}%`;
        questionBox.textContent = current.q;

        optionsContainer.innerHTML = '';
        current.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = `${idx + 1}. ${opt}`;
            btn.onclick = () => selectOption(idx);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIdx) {
        if (answered) return;
        answered = true;

        const current = questions[currentIdx];
        const buttons = optionsContainer.getElementsByTagName('button');

        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true;
            if (i === current.answer) {
                buttons[i].classList.add('correct');
            } else if (i === selectedIdx) {
                buttons[i].classList.add('incorrect');
            }
        }

        if (selectedIdx === current.answer) {
            score++;
            scoreTracker.textContent = `맞힌 개수: ${score}`;
            feedbackBox.innerHTML = `<strong>정답입니다!</strong><br>${current.rationale}`;
            feedbackBox.className = 'feedback-box correct-fb';
        } else {
            feedbackBox.innerHTML = `<strong>오답입니다.</strong><br>${current.rationale}`;
            feedbackBox.className = 'feedback-box incorrect-fb';
        }

        feedbackBox.style.display = 'block';
        nextBtn.style.display = 'block';

        if (currentIdx === questions.length - 1) {
            nextBtn.textContent = '결과 보기';
        } else {
            nextBtn.textContent = '다음 문제로 이동';
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            quizContainer.style.display = 'none';
            resultScreen.style.display = 'block';
            finalScore.textContent = `${score} / ${questions.length}`;
        }
    }

    function restartQuiz() {
        currentIdx = 0;
        score = 0;
        quizContainer.style.display = 'block';
        resultScreen.style.display = 'none';
        loadQuestion();
    }

    loadQuestion();
</script>
</body>
</html>
